[project]
name = "music-audiolyser"
version = "0.1.0"
description = "School project focused on analyzing song features to train models such as KNN, with the potential to explore additional models in the future. This project serves as a practical example of when and how machine learning models can be applied."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = "3.9.18"
dependencies = [
    "customtkinter (>=5.2.2,<6.0.0)",
    "essentia-tensorflow (==2.1b6.dev1110)",
    "numpy (==1.26.4)",
    "yt-dlp (==2025.3.26)",
    "pandas (>=2.3.2,<3.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "scikit-learn (==1.6.1)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pytest = "^8.4.1"
isort = "^6.0.1"
pre-commit = "^4.3.0"
flake8 = "6.1.0"
pytest-cov = "^6.2.1"

[tool.poetry]
package-mode = false


[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true


