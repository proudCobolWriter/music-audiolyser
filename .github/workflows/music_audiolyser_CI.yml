name: Music Audiolyser CI

on:
  push:
    branches: [ python-program ]
  pull_request:
    branches: [ python-program ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev

      - name: Lint
        run: poetry run flake8 .

      - name: Format check
        run: poetry run black --check .

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install
          poetry run pip install pyinstaller

      - name: Build executable
        run: poetry run pyinstaller main.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-audiolyser-${{ matrix.os }}
          path: dist/